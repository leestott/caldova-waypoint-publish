name: Validate and package Waypoint
on:
  push:
    paths: ['**']
  pull_request:
    paths: ['**']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.13']
        manifest: ['1.24', '1.30']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements.txt
      - run: python -m pip install -r requirements.txt
      - run: python -m pip check
      - run: python scripts/check_public.py
      - run: python -m unittest discover -s tests -v
      - run: python scripts/package.py --demo ${{ matrix.manifest == '1.24' && '--compatibility' || '' }}
      - uses: actions/upload-artifact@v4
        with:
          name: waypoint-demo-python-${{ matrix.python }}-manifest-${{ matrix.manifest }}-not-for-tenant-upload
          path: dist/demo/waypoint-DEMO-NOT-FOR-UPLOAD.zip
          if-no-files-found: error
